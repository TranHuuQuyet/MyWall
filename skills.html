<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skills | Dashboard</title>
    <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <link rel="stylesheet" href="css/style_dashboard.css" />
  </head>
  <body>
    <input type="checkbox" id="menu-side" class="menu-side" />
    <header>
      <label for="menu-side" class="hamburger">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          height="24px"
          viewBox="0 -960 960 960"
          width="24px"
          fill="#c5c5c5"
        >
          <path
            d="M120-240v-80h720v80H120Zm0-200v-80h720v80H120Zm0-200v-80h720v80H120Z"
          />
        </svg>
      </label>
      <h1>Skills</h1>
    </header>
    <main>
      <section class="sidebar">
        <nav>
          <ul class="menu-sidebar">
            <li>
              <a href="admin.html">
                <i class="fa-solid fa-gauge"></i>
                <span>Dashboard</span>
              </a>
            </li>

            <li>
              <a href="projects.html">
                <i class="fa-solid fa-folder-open"></i>
                <span>Projects</span>
              </a>
            </li>

            <li>
              <a href="experience.html">
                <i class="fa-solid fa-briefcase"></i>
                <span>Experience</span>
              </a>
            </li>

            <li>
              <a href="skills.html" class="active">
                <i class="fa-solid fa-code"></i>
                <span>Skills</span>
              </a>
            </li>

            <li>
              <a href="contact.html">
                <i class="fa-solid fa-envelope"></i>
                <span>Contact</span>
              </a>
            </li>

            <li>
              <a href="index.html">
                <i class="fa-solid fa-right-from-bracket"></i>
                <span>Logout</span>
              </a>
            </li>
          </ul>
        </nav>
      </section>
      <section class="content">
        <div class="item">
          <h2>Set up Skills</h2>
          <button class="add-btn">+ Add</button>
        </div>
        <div class="container">
          <div class="management-card">
            <strong>FRONTEND</strong>
            <table>
              <tr>
                <td>HTML</td>
                <td>Intermediate</td>
                <td><button class="adsave">Edit</button></td>
              </tr>
              <tr>
                <td>CSS</td>
                <td>Intermediate</td>
                <td><button class="adsave">Edit</button></td>
              </tr>
              <tr>
                <td>JS</td>
                <td>Intermediate</td>
                <td><button class="adsave">Edit</button></td>
              </tr>
            </table>
            <div class="actions">
              <button class="adsave">Add</button>
              <button class="adsave">Save</button>
            </div>
          </div>
          <div class="management-card">
            <strong>BACKEND</strong>
            <table>
              <tr>
                <td>Coming soon</td>
                <td>-</td>
                <td><button class="adsave">Edit</button></td>
              </tr>
              <tr>
                <td>Coming soon</td>
                <td>-</td>
                <td><button class="adsave">Edit</button></td>
              </tr>
              <tr>
                <td>Coming soon</td>
                <td>-</td>
                <td><button class="adsave">Edit</button></td>
              </tr>
            </table>
            <div class="actions">
              <button class="adsave">Add</button>
              <button class="adsave">Save</button>
            </div>
          </div>
          <div class="management-card">
            <strong>TOOLS</strong>
            <table>
              <tr>
                <td>Github</td>
                <td>Intermediate</td>
                <td><button class="adsave">Edit</button></td>
              </tr>
              <tr>
                <td>Git</td>
                <td>Intermediate</td>
                <td><button class="adsave">Edit</button></td>
              </tr>
              <tr>
                <td>-</td>
                <td>-</td>
                <td><button class="adsave">Edit</button></td>
              </tr>
            </table>
            <div class="actions">
              <button class="adsave">Add</button>
              <button class="adsave">Save</button>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
