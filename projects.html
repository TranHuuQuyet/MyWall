<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projects | Dashboard</title>
    <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <link rel="stylesheet" href="css/style_dashboard.css" />
  </head>
  <body>
    <header>
      <h1>Projects</h1>
    </header>
    <main>
      <section class="sidebar">
        <nav>
          <ul class="menu-sidebar">
            <li>
              <a href="admin.html">
                <i class="fa-solid fa-gauge"></i>
                <span>Dashboard</span>
              </a>
            </li>

            <li>
              <a href="projects.html" class="active">
                <i class="fa-solid fa-folder-open"></i>
                <span>Projects</span>
              </a>
            </li>

            <li>
              <a href="experience.html">
                <i class="fa-solid fa-briefcase"></i>
                <span>Experience</span>
              </a>
            </li>

            <li>
              <a href="skills.html">
                <i class="fa-solid fa-code"></i>
                <span>Skills</span>
              </a>
            </li>

            <li>
              <a href="contact.html">
                <i class="fa-solid fa-envelope"></i>
                <span>Contact</span>
              </a>
            </li>

            <li>
              <a href="login.html">
                <i class="fa-solid fa-right-from-bracket"></i>
                <span>Logout</span>
              </a>
            </li>
          </ul>
        </nav>
      </section>
      <section class="content">
        <div class="item">
          <h2>Set up Project</h2>
          <button class="add-btn">+ Add</button>
        </div>
        <div class="container">
          <div class="management-card">
            <strong>PROJECT</strong>
            <table>
              <tr>
                <td>Name Project</td>
                <td>FNB stock system</td>
                <td><button class="adsave">Edit</button></td>
              </tr>
              <tr>
                <td>Tech</td>
                <td>TS</td>
                <td><button class="adsave">Edit</button></td>
              </tr>
              <tr>
                <td>Link</td>
                <td>
                  <a href="https://github.com/TranHuuQuyet/fnb-stock-system"
                    >View Repository</a
                  >
                </td>
                <td><button class="adsave">Edit</button></td>
              </tr>
            </table>
            <div class="actions">
              <button class="adsave">Add</button>
              <button class="adsave">Save</button>
            </div>
          </div>
          <div class="management-card">
            <strong>PROJECT</strong>
            <table>
              <tr>
                <td>Name Project</td>
                <td>Net manager</td>
                <td><button class="adsave">Edit</button></td>
              </tr>
              <tr>
                <td>Tech</td>
                <td>C#</td>
                <td><button class="adsave">Edit</button></td>
              </tr>
              <tr>
                <td>Link</td>
                <td>
                  <a href="https://github.com/TranHuuQuyet/net-manager"
                    >View Repository</a
                  >
                </td>
                <td><button class="adsave">Edit</button></td>
              </tr>
            </table>
            <div class="actions">
              <button class="adsave">Add</button>
              <button class="adsave">Save</button>
            </div>
          </div>
        </div>
      </section>
